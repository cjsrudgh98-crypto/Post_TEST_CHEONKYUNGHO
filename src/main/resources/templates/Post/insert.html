<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 등록</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>게시글 등록</h1>

        <form th:action="@{/Post/insert}" method="post">
            <table class="form">
                <tr>
                    <th>제목</th>
                    <td><input type="text" name="title" required maxlength="200"></td>
                </tr>
                <tr>
                    <th>작성자</th>
                    <td><input type="text" name="writer" required maxlength="100"></td>
                </tr>
                <tr>
                    <th>내용</th>
                    <td><textarea name="content" rows="10"></textarea></td>
                </tr>
            </table>

            <div class="actions">
                <button type="submit" class="btn">등록</button>
                <a class="btn secondary" th:href="@{/Post/list}">목록</a>
            </div>
        </form>
    </div>
</body>
</html>
